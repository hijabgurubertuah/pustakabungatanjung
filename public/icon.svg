<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Book Icon -->
  <g transform="translate(106, 116)">
    <!-- Book pages -->
    <path d="M 30 220 Q 150 190 270 220 L 270 60 Q 150 30 30 60 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 150 60 L 150 220" stroke="#0369a1" stroke-width="4" />
    <path d="M 60 90 Q 110 75 135 85" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 60 120 Q 110 105 135 115" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 60 150 Q 110 135 135 145" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 165 85 Q 190 75 240 90" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 165 115 Q 190 105 240 120" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 165 145 Q 190 135 240 150" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Flower Lotus on top -->
    <path d="M 150 15 C 130 -10 100 10 150 45 C 200 10 170 -10 150 15 Z" fill="url(#gold)" />
    <path d="M 150 20 C 110 10 90 40 135 48 C 110 40 130 15 150 20 Z" fill="#f59e0b" />
    <path d="M 150 20 C 190 10 210 40 165 48 C 190 40 170 15 150 20 Z" fill="#f59e0b" />
  </g>

  <!-- Subtitle -->
  <text x="256" y="420" font-family="sans-serif" font-weight="900" font-size="32" fill="#38bdf8" text-anchor="middle" letter-spacing="4">PERPUSTAKAAN</text>
  <text x="256" y="455" font-family="sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">BUNGA TANJUNG</text>
</svg>